# Base run config for the plate-with-hole GNN surrogate.
#
# The AirfRANS project never actually populated its configs/ dir -- hyperparams
# lived as scattered constants in train.py. Doing it properly here: this file
# is the single source of truth for model/training hyperparameters, loaded by
# src/train.py's __main__ entry point.
#
# data_generation is documentation, not runtime-loaded: those values are
# Abaqus-side constants in src/generate_dataset.py (which runs under Abaqus's
# own Python 2.7 kernel, not this project's normal Python env) -- listed here
# so the two stay easy to cross-check, not because this file drives that script.

data_generation:
  plate_width_mm: 100.0
  plate_height_mm: 200.0
  hole_radius_range_mm: [3.0, 15.0]
  hole_margin_from_edge_mm: 12.0
  load_displacement_range_mm: [0.05, 0.20]
  material:
    youngs_modulus_mpa: 210000.0
    poissons_ratio: 0.3
    plastic_table_mpa_strain: [[250.0, 0.0], [300.0, 0.01], [400.0, 0.05]]
  mesh:
    element_type: CPS4R
    global_seed_mm: 2.0
    hole_edge_seed_factor: 0.15  # local seed size = hole radius * this factor

model:
  node_in_dim: 3  # [x, y, load] -- dropped signed_distance_to_hole, see
                  # src/graph.py's build_graph() docstring / PROJECT_FLOW.md phase 10
  edge_in_dim: 2
  out_dim: 3
  latent_dim: 32
  hidden_dim: 64
  n_message_passing: 8  # bumped from 4 -- phase 10's non-parametric (no
                        # signed_distance_to_hole) model regressed badly on
                        # peak-stress location (18.1mm -> 51.6mm) even with
                        # 250 clean epochs. Working theory: with no explicit
                        # distance feature, a node's only path to "where's
                        # the hole" is message-passing hops from hole-
                        # boundary nodes (whose local mesh is finer, so
                        # locally self-detectable) -- 4 hops * ~2mm mesh
                        # spacing gives only ~8mm of reach, nowhere near
                        # enough for holes up to 15mm radius needing a
                        # multi-diameter correction zone. This is a genuine
                        # diagnostic, not a guaranteed fix -- see
                        # PROJECT_FLOW.md phase 10/11 for the honest caveat
                        # that even 8 hops (~16mm) may still fall short for
                        # the largest holes / most distant nodes.

training:
  max_epochs: 250  # bumped from 100 -- first full run's peak-stress accuracy was
                   # weak (37% relative error, 18mm location miss on the 20-case
                   # holdout, see PROJECT_FLOW.md phase 8); cheapest thing to try
                   # first before touching model capacity or the loss function
  batch_size: 1
  accumulate_grad_batches: 4
  n_val: 20  # 10% holdout -- was 2 for the 3-case overfit test, too thin now that
             # the real 200-case dataset is generated
  lr: 0.001
  checkpoint_every_n_epochs: 5
  num_workers: 2
  precision: "32-true"

paths:
  raw_dir: data/raw
  cache_dir: data/cache
  stats_path: data/norm_stats.npz
  checkpoint_path: data/meshgraphnet.ckpt
